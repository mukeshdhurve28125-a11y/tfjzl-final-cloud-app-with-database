{% extends "onlinecourse/base_course.html" %}

{% block content %}
<div class="container-fluid">
    <h2>{{ course.name }}</h2>
    <p>{{ course.description }}</p>

    <h3>Lessons</h3>
    <div class="accordion" id="accordionLesson">
        {% for lesson in course.lesson_set.all %}
            <div class="card">
                <div class="card-header" id="heading{{ lesson.id }}">
                    <h5 class="mb-0">
                        <button class="btn btn-link" type="button" data-toggle="collapse" data-target="#collapse{{ lesson.id }}">
                            {{ lesson.title }}
                        </button>
                    </h5>
                </div>
                <div id="collapse{{ lesson.id }}" class="collapse" data-parent="#accordionLesson">
                    <div class="card-body">
                        {{ lesson.content }}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
